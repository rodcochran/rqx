[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "rqx"
description = "Rust-backed Python HTTP client with an httpx-compatible API."
requires-python = ">=3.8"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/rodcochran/rqx"
Repository = "https://github.com/rodcochran/rqx"
Issues = "https://github.com/rodcochran/rqx/issues"
Changelog = "https://github.com/rodcochran/rqx/releases"

[tool.maturin]
module-name = "rqx._rqx"
python-source = "python"
# Build the wheel with pyo3's extension-module behavior. Kept here (rather than
# always-on in Cargo.toml) so `cargo test`/`cargo build` can link libpython.
features = ["extension-module"]

[project.optional-dependencies]
benchmarks = [
    "matplotlib",
    "numpy",
]

# PEP 735 groups: private to development, never installable as `rqx[...]`.
# `uv sync` installs `dev` by default; CI's test job uses `--only-group test`.
[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    "hypothesis",
    "filelock",
    "brotli",
    "zstandard",
    "hypercorn",
    "rich",
    "testcontainers",
    "httpx>=0.28",
    "maturin>=1.12,<2.0",
]
lint = [
    "ruff",
    "ty",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.pytest.ini_options]
# Hang guard: no single test should take anywhere near this.
timeout = 30
markers = [
    "integration: starts an httpbin container via testcontainers (needs Docker)",
    "equivalence: same body run against httpx and rqx",
    "rqx_diverges(issue, reason): known divergence from httpx; strict xfail for the rqx case",
    "slow: takes seconds; memory-bound streaming checks",
]

[tool.ty.rules]
"unresolved-import" = "ignore"