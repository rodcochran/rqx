# Cargo.toml
[package]
name = "rqx-core"
version = "0.3.0"
edition = "2024"

[lib]
name = "_rqx"
crate-type = ["cdylib"]

[features]
# pyo3's `extension-module` tells it NOT to link libpython (correct for the
# built wheel, where the host interpreter provides the symbols). Enabled for
# maturin builds via [tool.maturin] `features`, but left OFF by default so
# `cargo test`/`cargo build` link libpython normally and can run the pure-Rust
# unit tests (notably on Linux CI, which has no `-undefined dynamic_lookup`).
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = "1.11.1"
encoding_rs = "0.8"
futures = "0.3.32"
http = "1.4.0"
hyper = "1"
mime = "0.3"
pyo3 = { version = "0.29.2" }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
rand = "0.10"
reqwest = { version = "0.13.2", features = [
    "json", 
    "query", 
    "form", 
    "http2", 
    "cookies", 
    "stream", 
    "gzip", 
    "brotli", 
    "zstd", 
    "deflate"
] }
serde = "1.0.228"
# preserve_order: dict order on the wire and in response.json(), like stdlib.
# float_roundtrip: correctly-rounded float parsing; the default is best-effort
# and can return a value one ulp off the document (found by hypothesis, #44).
serde_json = { version = "1.0.149", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
